<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/perfil.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="icon" href="../img/cardapio.ico">
    <title>Meu Perfil</title>
</head>
<body>

    <main class="container-fluid vh-100 caixa_perfil">
        <div class="row g-0 h-100 align-items-center justify-content-center">
            
            <div class="col-12 col-lg-10 h-80 d-flex align-items-center justify-content-center">
                
                <div class="card cartao_perfil overflow-hidden h-100 border-0 arredondado_bloco">
                    <div class="row g-0 h-100">
                        
                        <div class="col-12 col-md-6 h-100">
                            <img src="../img/cafe.jpeg" class="img-fluid objeto_foto" alt="Imagem Lateral do Perfil">
                        </div>

                        <div class="col-12 col-md-6 h-100 d-flex align-items-center justify-content-center p-4 p-md-5">
                            <div class="w-100">
                                <h2 class="text-center mb-4 titulo_perfil">Meu Perfil</h2>
                                
                                <div class="text-center mb-4">
                                    <div>
                                        <i class="bi bi-person-circle icone_usuario"></i>
                                    </div>
                                </div>

                                <form>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-person"></i> Nome Completo</label>
                                        <h2>dados dos usuários</h2>                                            
                                    </div>

                                    <div class="mb-3 mt-5">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-envelope"></i> E-mail</label>
                                        <h3>usuario.teste@gmail.com</h3>
                                    </div>

                                    <div class="mb-3 mt-5">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-telephone"></i> Telefone / WhatsApp</label>
                                        <h3>12 9 8765-4321</h3>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </div> 
                </div>
            </div>
        </div>
    </main>

    <div class="fundo_cinza" id="fc"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/claro-escuro.js"></script>
    <script src="../JS/menu.js"></script>
</body>
</html>
