<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/perfil.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="icon" href="../img/perfil.ico">
    <title>Meu Perfil</title>
</head>
<body>
    <div class="fundo_cinza-login" id="fl"></div>
    <main class="container-fluid vh-100 caixa_perfil">
        
        <div class="row g-0 h-100 align-items-center justify-content-center">
            
            <div class="col-12 col-lg-10 h-80 d-flex align-items-center justify-content-center">
                
                <div class="card cartao_perfil overflow-hidden h-100 border-0 arredondado_bloco">
                    <div class="row g-0 h-100">
                        <div class="col-12 col-md-6 h-100 d-flex align-items-center justify-content-center p-4 p-md-5">
                            <div class="w-100">
                                <h2 class="text-center mb-4 titulo_perfil">Meu Perfil</h2>
                                
                                <div class="text-center mb-4">
                                    <div>
                                        <i class="bi bi-person-circle icone_usuario"></i>
                                    </div>
                                </div>

                                <form>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-person"></i> Nome Completo</label>
                                        <h2 id="nome-u"></h2>                                            
                                        <button id="bn" onclick="mudarnome()"> modificar nome</button >
                                    </div>

                                    <div class="mb-3 mt-5">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-envelope"></i> E-mail</label>
                                        <h3 id="e-mail-u"></h3>
                                        <button id="be" onclick="mudaremail()">modificar email</button>
                                    </div>

                                    <div class="mb-3 mt-5">
                                        <label class="form-label fw-bold texto_campo"><i class="bi bi-telephone"></i> Telefone / WhatsApp</label>
                                        <h3 id="telefone-u"></h3>
                                        <button id="bt" onclick="mudartelefone()">modificar  telefone</button>
                                    </div>
                                    <div>
                                        <button id="bs" onclick="sair()">sair da conta</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="col-12 col-md-6 d-flex">
                            <img src="../img/cafe.jpeg" class="img-fluid w-100 h-100 object-fit-cover" alt="Imagem Lateral do Perfil" style="min-height: 300px;">
                        </div>
                    </div> 
                </div>
            </div>
        </div>
    </main>

    <div class="fundo_cinza" id="fc"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/menu.js"></script>
    <script src="../JS/perfil.js"></script>
</body>
</html>
