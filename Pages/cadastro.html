<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>cadastro</title>
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="../img/cadastro.ico">
</head>
<body style="background-color: var(--cor-body);">

<header>
    <h1 class="titulo">Faça seu cadastro</h1>
</header>

<div class="principal">

    <div class="logo">
        <div class="xicara">☕</div>
    </div>

    <div class="formulario">

        <h2>Criar Conta</h2>

        <p>Preencha seus dados necessarios para criar a sua conta</p>

        <label>Nome Completo</label>
        <input type="text" placeholder="Digite seu nome completo">

        <label >Email</label>
        <input type="email" placeholder="Digite seu email">

        <label>Telefone</label>
        <input type="telefone" placeholder="(00) 00000-0000">

        <label>Senha</label>
        <input type="senha" placeholder="Digite sua senha">

        <label>Confirmar Senha</label>
        <input type="senha" placeholder="Confirme sua senha">

        <button type="submit">Criar Conta</button>

    </div>

</div>

<footer>
    <p>2026 - Anny Maia, Arthur Velasquez e Davi Passos</p>
    <a href="index.html">Página Inicial</a>
</footer>
<script src="../JS/menu.js"></script>
</body>
</html>
