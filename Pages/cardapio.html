<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/cardapio.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="icon" href="../img/cardapio.ico">
    <title>Cardápio</title>
</head>
<body>
    <main class="container-fluid py-5 container-cardapio" style="padding-left: 100px; padding-right: 20px;">
        <h2 class="text-center mb-5" class="titulo">Nosso Cardápio</h2>

        <h3 class="mb-4">Cafés:</h3>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
            
            <div class="col">
                <div class="card h-100 card-item">
                    <img src="" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Espresso Tradicional</h5>
                        <p class="card-text">Café puro.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <p class="preco">R$ 7,50</p>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 card-item">
                    <img src="img/cappuccino.jpeg" class="card-img-top" >
                    <div class="card-body">
                        <h5 class="card-title">Cappuccino</h5>
                        <p class="card-text">nao sei=]</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="preco">R$ 12,00</span>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 card-item">
                    <img src="img/caramel.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Descafeinado</h5>
                        <p class="card-text">Café sem cafe.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="preco">R$ 14,50</span>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="mb-4">Acompanhamentos:</h3>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            
            <div class="col">
                <div class="card h-100 card-item">
                    <img src="img/pao_de_queijo.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Pão de Queijo</h5>
                        <p class="card-text">pão de queijo.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="preco">R$ 6,00</span>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 card-item">
                    <img src="img/croissant.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Croissant</h5>
                        <p class="card-text">Pão enrolado.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="preco">R$ 11,00</span>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 card-item">
                    <img src="img/cookie.jpeg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Cookie Chocolate</h5>
                        <p class="card-text">Cookie de chocolate.</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="preco">R$ 8,50</span>
                            <button type="button"><i></i> Pedir</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="fundo_cinza" id="fc"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/menu.js"></script>
    <script src="../JS/claro-escuro.js"></script>
</body>
</html>
