<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/compras.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="icon" href="../img/cardapio.ico">
    <title>Compras</title>
</head>
<body>
    <main class="container-fluid py-5 menu_container" style="padding-left: 100px; padding-right: 20px;">

        <div class="row g-4">
            <div class="col-12 col-lg-8">
                
                <div id="lista-produtos"></div>

                <h4 class="mb-3 menu_subtitulo" style="color: aliceblue;">Cupons Disponíveis</h4>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card card_cupom text-center">
                            <div class="card-body">
                                <div class="cupom_icone mb-2">
                                    <i class="bi bi-ticket-perforated"></i>
                                </div>
                                <h5 class="cupom_codigo mb-1">CAFEMAIS</h5>
                                <p class="card-text text-muted small mb-3">10% de desconto na primeira compra</p>
                                <button class="btn btn_cupom btn-sm w-100" onclick="copiarCupom('CAFEMAIS')">Copiar Código</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card card_cupom text-center">
                            <div class="card-body">
                                <div class="cupom_icone mb-2">
                                    <i class="bi bi-truck"></i>
                                </div>
                                <h5 class="cupom_codigo mb-1">GRATISCOFFEE</h5>
                                <p class="card-text text-muted small mb-3">Entrega grátis para pedidos acima de R$ 30</p>
                                <button class="btn btn_cupom btn-sm w-100" onclick="copiarCupom('GRATISCOFFEE')">Copiar Código</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card card_resumo">
                    <div class="card-body">
                        <h4 class="resumo_titulo mb-4">Resumo do Pedido</h4>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">POSSUI UM CUPOM?</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="input-cupom" placeholder="Inserir cupom...">
                                <button class="btn btn_aplicar" type="button" onclick="aplicarCupom()">Aplicar</button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span class="fw-bold text-dark" id="resumo-subtotal">R$ 0,00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Entrega</span>
                            <span class="fw-bold text-dark" id="resumo-entrega">R$ 5,00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-success">
                            <span>Desconto</span>
                            <span id="resumo-desconto">- R$ 0,00</span>
                        </div>
                        <hr class="my-3" style="border-color: #e0e0e0;">
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold h5 mb-0">Total</span>
                            <span class="fw-bold h5 mb-0 valor_total" id="resumo-total">R$ 0,00</span>
                        </div>

                        <button class="btn btn_finalizar w-100 py-2" onclick="finalizarPedido()">Finalizar Compra</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="fundo_cinza" id="fc"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/compras.js"></script> <script src="../JS/menu.js"></script>
    <script src="../JS/claro-escuro.js"></script>
</body>
</html>
