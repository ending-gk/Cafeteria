<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
    <link rel="icon" href="img/favicon.ico">
    <title>Cafeteria</title>
</head>
<body>
    <div class="fundo_cinza" id="fc"></div>

    <header>
            <h1 class="titulo"> Good Coffee </h1>
            <button id='login' class = "btn btn-outline" onclick="aparecer()"> login </button>
            <button class="tema" id="tema" onclick="mudartema()">
                <span class="claro-icone" id="claro-icone"><i class="bi bi-sun" id="sol"></i></span>
                <span class="escuro-icone" id="escuro-icone"><i class="bi bi-moon" id="lua"></i></span>
            </button>
    </header>
    <main>
        <div class="fundo_cinza-login" id="fl">
            <form class="form-login">
                <h1 style="color:var(--cor-texto)" class="titulo-form">Faça o seu login!</h1>
                <h3 style="color:var(--cor-texto)" class="desc-form"> Faça o seu login  no nosso site para ter acesso ao nosso cardápio
                    e fazer seus pedidos
                </h3>
                    
                        <button  class='x' type="button" onclick="fechar()">
                            <i class="bi bi-x"></i>
                        </button>
                    
                
                <label for="nome_de_usuario"></label>
                <input class='usuario' type="text" id="nome_de_usuario" placeholder="Nome de Usuário">
                
                   
                    <label for="senha"></label>
                    <input class="senha" type="password" id="senha" placeholder="Senha">
                
                    <button class="login" onclick="login()">
                        Login
                    </button>
                    <h5 class='texto-cad'> Não tem uma conta? Sem problema,  crie uma. </h5>
                    <a  class='link-cad'href="Pages/cadastro.html">Cria Conta</a>
                </div>
            </form>
        </div>
        <div class="container mt-5 mb-5" style="border-radius: 15;">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <img src="img/cafe_com_morango.webp" class="d-block w-100" alt="Slide 1">
                            </div>
                            <div class="carousel-item">
                                <img src="img/capa_jogo.webp" class="d-block w-100" alt="Slide 2">
                            </div>
                            <div class="carousel-item">
                                <img src="img/latte_de_morango.webp" class="d-block w-100" alt="Slide 3">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </div>               
        </div>
    </main>
    <footer>
        <p>2026 - Anny Maia, Davi Passos e Arthur Velasquez</p>
        <p>Nos conheça melhor em  <a class="saibamais" href="Pages/saiba_mais.html">Saiba Mais</a></p>
    </footer>
<script src="JS/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/menu.js"></script>
<script src="JS/claro-escuro.js"></script>
</body>
</html>
