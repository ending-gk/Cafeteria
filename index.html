<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
    <link rel="stylesheet" href="CSS/menu.css">
    <link rel="icon" href="img/favicon.ico">

    <title>Cafeteria</title>
</head>
<body>

    <div class="fundo_cinza" id="fc"></div>

    <div id="conteudo-menu"></div>

    <header>
        <h1 class="titulo">Good Coffee</h1>
        <button id="login" class="btn btn-outline" onclick="aparecer()">Login</button>
    </header>

    <main>
        <div class="fundo_cinza-login" id="fl">
            <form class="form-login">
                <h1 style="color:var(--cor-texto)" class="titulo-form">Faça o seu login!</h1>

                <h3 style="color:var(--cor-texto)" class="desc-form">
                    Faça o seu login no nosso site para ter acesso ao nosso cardápio
                    e fazer seus pedidos.
                </h3>

                <button class="x" type="button" onclick="fechar()">
                    <i class="bi bi-x"></i>
                </button>

                <label for="nome_de_usuario"></label>
                <input class="usuario" type="text" id="nome_de_usuario" placeholder="Nome de Usuário">

                <label for="senha"></label>
                <input class="senha" type="password" id="senha" placeholder="Senha">

                <button class="login" type="button" onclick="login()">
                    Login
                </button>

                <h5 class="texto-cad">Não tem uma conta? Sem problema, crie uma.</h5>
                <a class="link-cad" href="Pages/cadastro.html">Criar Conta</a>
            </form>
        </div>

        <div id="carouselExampleIndicators" class="carousel slide ms-auto" style="width: 90%;">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/inicio_1.jpeg" class="d-block" alt="Slide 1">
                </div>

                <div class="carousel-item">
                    <img src="img/inicio_2.jpeg" class="d-block" alt="Slide 2">
                </div>

                <div class="carousel-item">
                    <img src="img/inicio_3.jpeg" class="d-block" alt="Slide 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Anterior</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </main>

    <footer>
        <p>2026 - Anny Maia, Davi Passos e Arthur Velasquez</p>
        <p>
            Nos conheça melhor em
            <a class="saibamais" href="Pages/saiba_mais.html">Saiba Mais</a>
        </p>
    </footer>

    <script src="JS/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/menu.js"></script>

</body>
</html>
